version: "3.9"

services:
  # ===== Backend connected to Neon (default) =====
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veg-backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8080}

      # ---- Neon Postgres (from .env)
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}

      # ---- Safer defaults for dev
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SQL_INIT_MODE: ${SQL_INIT_MODE:-never}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      # ---- App settings
      APP_RESET_LINK_BASE: ${APP_RESET_LINK_BASE:-http://localhost:3000/reset-password?token=}
      APP_SECURITY_COOKIE_SECURE: ${APP_SECURITY_COOKIE_SECURE:-false}
      JWT_SECRET: ${JWT_SECRET}

      # ---- Optional mail config
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
    ports:
      - "8080:8080"
    networks:
      - veggienet

  # ===== Local Postgres (optional) =====
  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    container_name: veg-postgres
    environment:
      POSTGRES_DB: vegetable_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veggienet

  # ===== Backend against local Postgres (optional) =====
  app-local:
    profiles: ["local-db"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veg-backend-local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/vegetable_shop
      DB_USER: postgres
      DB_PASS: postgres
      JPA_DDL_AUTO: update
      SQL_INIT_MODE: never
      SPRING_PROFILES_ACTIVE: dev
      APP_RESET_LINK_BASE: http://localhost:3000/reset-password?token=
      APP_SECURITY_COOKIE_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
    ports:
      - "8080:8080"
    networks:
      - veggienet

networks:
  veggienet:

volumes:
  pgdata:
