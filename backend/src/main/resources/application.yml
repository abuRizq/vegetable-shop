server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  reset-link-base: ${APP_RESET_LINK_BASE:http://localhost:3000/reset-password?token=}
  security:
    cookie-secure: ${APP_SECURITY_COOKIE_SECURE:false}
    refresh-token-validity-seconds: ${APP_SECURITY_REFRESH_TOKEN_VALIDITY_SECONDS:1209600} # 14 days
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:900000}
